<!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TextAudio - Leitor Multilingue</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;600&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background: #f0f4f8;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }
    header {
      background: #2c3e50;
      color: white;
      width: 100%;
      padding: 1rem;
      text-align: center;
      font-size: 1.5rem;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
    main {
      width: 100%;
      max-width: 700px;
      padding: 2rem;
    }
    textarea {
      width: 100%;
      height: 200px;
      padding: 1rem;
      font-size: 1rem;
      border-radius: 10px;
      border: 1px solid #ccc;
      resize: none;
    }
    select, button {
      margin-top: 1rem;
      padding: 0.75rem;
      font-size: 1rem;
      border-radius: 8px;
      border: none;
      cursor: pointer;
    }
    select {
      width: 100%;
      background-color: #fff;
      border: 1px solid #ccc;
    }
    button {
      background-color: #3498db;
      color: white;
      width: 100%;
      margin-top: 1.5rem;
      transition: background-color 0.3s;
    }
    button:hover {
      background-color: #2980b9;
    }
    footer {
      margin-top: auto;
      padding: 1rem;
      text-align: center;
      font-size: 0.8rem;
      color: #555;
    }
  </style>
</head>
<body>
  <header>
    <i class="fas fa-volume-up"></i> TextAudio - Leitor Multilingue
  </header>
  <main>
    <textarea id="textInput" placeholder="Digite ou cole seu texto aqui..."></textarea>
    <select id="voiceSelect"></select>
    <button onclick="speakText()"><i class="fas fa-play"></i> Ouvir Texto</button>
  </main>
  <footer>
    &copy; 2025 TextAudio | App Web Multilingue com TTS
  </footer>
  <script>
    const synth = window.speechSynthesis;
    const voiceSelect = document.getElementById('voiceSelect');function populateVoices() {
  const voices = synth.getVoices();
  voiceSelect.innerHTML = '';
  voices.forEach(voice => {
    const option = document.createElement('option');
    option.textContent = `${voice.name} (${voice.lang})`;
    option.value = voice.name;
    voiceSelect.appendChild(option);
  });
}

synth.onvoiceschanged = populateVoices;

function speakText() {
  const text = document.getElementById('textInput').value;
  const selectedVoice = voiceSelect.value;
  const utterance = new SpeechSynthesisUtterance(text);
  const voices = synth.getVoices();
  utterance.voice = voices.find(v => v.name === selectedVoice);
  synth.speak(utterance);
}

window.onload = () => {
  populateVoices();
};

  </script>
</body>
</html>
